# ============================================================
# estadisticas-service  -  Horizontal Pod Autoscaler (escala por CPU)
# Requiere metrics-server instalado en el clúster.
# Umbral 50%: equilibra capacidad de respuesta y costo (justificar en informe).
# ============================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: estadisticas-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: estadisticas-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
